name: CI
on:
  push:
    branches: [release-mapbox-scoped]
  pull_request:
    branches: [release-mapbox-scoped]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
